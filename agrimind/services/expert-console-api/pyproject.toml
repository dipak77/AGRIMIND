[project]
name = "expert-console-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "structlog>=24.0.0",
    "agrimind-kernel",
    "memory",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["expert_console_api"]

[tool.uv.sources]
agrimind-kernel = { workspace = true }
memory = { workspace = true }