[project]
name = "vision-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "structlog>=24.0.0",
    "agrimind-kernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vision_service"]

[tool.uv.sources]
agrimind-kernel = { workspace = true }
agents = { workspace = true }
memory = { workspace = true }
eval = { workspace = true }