groups:
  - name: agrimind_alerts
    rules:
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
      
      - alert: SafetyBreach
        expr: rate(safety_violations_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Safety violation detected"
      
      - alert: ModelDrift
        expr: rate(model_confidence_low_total[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Model confidence drift detected"
      
      - alert: WorkerStall
        expr: temporal_workflow_tasks_backlog > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Temporal worker backlog detected"
