groups:
  - name: agrimind-safety
    interval: 30s
    rules:
      - alert: HighSafetyViolationRate
        expr: rate(agrimind_safety_violations_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
          team: ai-safety
        annotations:
          summary: "High rate of safety violations detected"
          description: "Safety violation rate is {{ $value }} per second over the last 5 minutes"

      - alert: ChemicalDosageHallucination
        expr: increase(agrimind_chemical_dosage_hallucination_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
          team: ai-safety
        annotations:
          summary: "Chemical dosage hallucination detected"
          description: "A chemical dosage hallucination was detected and blocked"

      - alert: PIILeakageDetected
        expr: increase(agrimind_pii_leakage_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "PII leakage detected"
          description: "Potential PII leakage detected in responses"

  - name: agrimind-quality
    interval: 30s
    rules:
      - alert: LowConfidenceSpike
        expr: avg(agrimind_agent_confidence_score) < 0.7
        for: 5m
        labels:
          severity: warning
          team: ai-platform
        annotations:
          summary: "Average agent confidence dropped below threshold"
          description: "Average confidence score is {{ $value }}"

      - alert: RetrievalMissRateHigh
        expr: sum(rate(agrimind_retrieval_misses_total[5m])) / sum(rate(agrimind_retrieval_requests_total[5m])) > 0.3
        for: 5m
        labels:
          severity: warning
          team: ai-platform
        annotations:
          summary: "High retrieval miss rate"
          description: "Retrieval miss rate is {{ $value | humanizePercentage }}"

      - alert: LanguageQualityDrop
        expr: avg(agrimind_language_quality_score{lang=\"mr\"}) < 0.8
        for: 10m
        labels:
          severity: warning
          team: localization
        annotations:
          summary: "Marathi language quality dropped"
          description: "Marathi language quality score is {{ $value }}"

  - name: agrimind-system
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job=~\"agrimind.*\"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "{{ $labels.job }} service is down"
          description: "Service {{ $labels.job }} has been down for more than 1 minute"

      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 3
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High p99 latency detected"
          description: "P99 latency is {{ $value }} seconds"

      - alert: WorkerStall
        expr: increase(temporal_activity_execution_latency_bucket[10m]) == 0
        for: 10m
        labels:
          severity: warning
          team: data-platform
        annotations:
          summary: "Temporal worker may be stalled"
          description: "No worker activity detected in the last 10 minutes"

      - alert: IngestionBacklog
        expr: temporal_task_queue_depth{queue=\"curation\"} > 1000
        for: 5m
        labels:
          severity: warning
          team: data-platform
        annotations:
          summary: "High curation queue backlog"
          description: "Curation queue depth is {{ $value }}"
