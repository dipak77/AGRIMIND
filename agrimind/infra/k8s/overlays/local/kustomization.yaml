apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: agrimind-local

commonLabels:
  environment: local

patches:
  # Reduce replicas for local development
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: gateway-service
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: assistant-api
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: agent-orchestrator
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: memory-service
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: inference-service

# Use local images or dev tags
images:
  - name: agrimind/gateway-service
    newTag: dev
  - name: agrimind/assistant-api
    newTag: dev
  - name: agrimind/agent-orchestrator
    newTag: dev
  - name: agrimind/memory-service
    newTag: dev
  - name: agrimind/inference-service
    newTag: dev

# Reduce resource requests for local dev
patchesStrategicMerge:
  - local-resources-patch.yaml
