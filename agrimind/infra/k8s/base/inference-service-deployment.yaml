apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-service
  namespace: agrimind
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-service
  template:
    metadata:
      labels:
        app: inference-service
    spec:
      containers:
        - name: inference-service
          image: agrimind/inference-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agrimind-config
            - secretRef:
                name: agrimind-secrets
          resources:
            requests:
              memory: "2Gi"
              cpu: "2000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
---
apiVersion: v1
kind: Service
metadata:
  name: inference-service
  namespace: agrimind
spec:
  selector:
    app: inference-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
