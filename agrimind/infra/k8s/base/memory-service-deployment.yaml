apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-service
  namespace: agrimind
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-service
  template:
    metadata:
      labels:
        app: memory-service
    spec:
      containers:
        - name: memory-service
          image: agrimind/memory-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agrimind-config
            - secretRef:
                name: agrimind-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: memory-service
  namespace: agrimind
spec:
  selector:
    app: memory-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
