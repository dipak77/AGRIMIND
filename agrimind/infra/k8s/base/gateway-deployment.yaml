apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: agrimind
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway
          image: agrimind/gateway-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agrimind-config
            - secretRef:
                name: agrimind-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: agrimind
spec:
  selector:
    app: gateway-service
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
