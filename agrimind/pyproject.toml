[project]
name = "agrimind"
version = "0.1.0"
description = "Autonomous Agricultural Intelligence Engine"
requires-python = ">=3.12"
dependencies = [
    "structlog>=26.1.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
    "workers/*"
]

[tool.uv.sources]
agrimind-kernel = { workspace = true }
agrimind-models = { workspace = true }
data-kernel = { workspace = true }
memory = { workspace = true }
eval = { workspace = true }

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF012", # mutable default value for class attribute (Pydantic Config classes)
]

[tool.ruff.lint.isort]
known-first-party = ["kernel", "data-kernel", "memory", "models", "agents", "eval"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
pythonpath = [".", "packages"]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.1",
    "pytest>=8.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]
