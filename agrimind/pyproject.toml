[project]
name = "agrimind-monorepo"
version = "0.1.0"
description = "AGRIMIND autonomous agricultural intelligence engine monorepo"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/agrimind-kernel",
    "packages/agrimind-models",
    "packages/data-kernel",
    "packages/memory",
    "packages/eval",
    "packages/agents",
    "services/gateway",
    "services/assistant-api",
    "services/agent-orchestrator",
    "services/memory",
    "services/inference",
    "services/vision",
    "services/feeds",
    "services/data-ingestion",
    "services/eval-service",
    "services/expert-console",
    "services/admin",
]

[tool.uv.sources]
agrimind-kernel = { workspace = true }
agrimind-models = { workspace = true }
data-kernel = { workspace = true }
memory = { workspace = true }
eval = { workspace = true }
agents = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
