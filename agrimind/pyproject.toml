[project]
name = "agrimind"
version = "0.1.0"
description = "Autonomous Agricultural Intelligence Engine"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.0.0",
]

[tool.uv.workspace]
members = [
    "packages/agrimind-kernel",
    "packages/data_kernel",
    "packages/memory",
    "packages/models",
    "packages/agents",
    "packages/eval",
    "services/*",
    "workers/*",
]
exclude = [
    "packages/_legacy_kernel_removed",
]

[tool.uv.sources]
agrimind-kernel = { workspace = true }
agrimind-models = { workspace = true }
data-kernel = { workspace = true }
memory = { workspace = true }
eval = { workspace = true }
agents = { workspace = true }

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = [
    "agrimind_kernel",
    "data_kernel",
    "memory",
    "agents",
    "eval",
    "inference",
    "registry",
    "tokenizer",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "packages/agrimind-kernel",
    "packages/memory",
    "packages/agents",
    "packages/eval",
    "packages/data_kernel",
    "packages/models",
    "packages/foundation_model",
    "workers/curation-worker",
    "services/data-ingestion-service",
    "services/data-ingestion-service/data_ingestion_service",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "mypy>=1.8.0",
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
]
