[project]
name = "memory"
version = "0.1.0"
description = "AGRIMIND Memory — GraphRAG, vector, hybrid retrieval"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "agrimind-kernel",
    "qdrant-client>=1.11.0",
    "neo4j>=5.14.0",
    "httpx>=0.27.0",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory"]

[tool.uv.sources]
agrimind-kernel = { workspace = true }
