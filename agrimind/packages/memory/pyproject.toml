[project]
name = "memory"
version = "0.1.0"
description = "AGRIMIND Memory Service - GraphRAG, Vector Search, and Retrieval"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
