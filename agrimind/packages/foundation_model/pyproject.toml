[project]
name = "foundation-model"
version = "0.1.0"
description = "KrishiMini-20M foundation model factory (scratch pretraining path)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foundation_model"]

[tool.pytest.ini_options]
pythonpath = ["."]
