[project]
name = "agrimind-models"
version = "0.1.0"
description = "AGRIMIND Model Factory - Tokenizer, Registry, Inference"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "agrimind-kernel",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat modules at package root (inference/, registry/, tokenizer/)
[tool.hatch.build.targets.wheel]
packages = ["inference", "registry", "tokenizer"]

[tool.uv.sources]
agrimind-kernel = { workspace = true }
