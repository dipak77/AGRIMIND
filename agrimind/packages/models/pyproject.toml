[project]
name = "agrimind-models"
version = "0.1.0"
description = "AGRIMIND Model Factory - Tokenizer, Registry, Inference"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "agrimind-kernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
agrimind-kernel = { workspace = true }
