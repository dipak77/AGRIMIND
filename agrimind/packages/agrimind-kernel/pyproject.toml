[project]
name = "agrimind-kernel"
version = "0.1.0"
description = "Core contracts, configuration, and safety primitives for AGRIMIND"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agrimind_kernel"]
