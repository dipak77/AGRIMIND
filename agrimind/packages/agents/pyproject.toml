[project]
name = "agents"
version = "0.1.0"
description = "AGRIMIND agent graphs, tools, and orchestration helpers"
requires-python = ">=3.12"
dependencies = [
    "agrimind-kernel",
    "memory",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.uv.sources]
agrimind-kernel = { workspace = true }
memory = { workspace = true }
