[project]
name = "data-kernel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agrimind-kernel",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "minio>=7.2.0",
    "pypdf>=4.0.0",
    "feedparser>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_kernel"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["../..", "."]
