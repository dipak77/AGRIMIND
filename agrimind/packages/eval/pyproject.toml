[project]
name = "eval"
version = "0.1.0"
description = "Evaluation harness and golden datasets for AGRIMIND"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
