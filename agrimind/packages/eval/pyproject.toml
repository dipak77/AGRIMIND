[project]
name = "eval"
version = "0.1.0"
description = "Evaluation harness and golden datasets for AGRIMIND"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "agrimind-kernel",
    "agents",
    "memory",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval"]

[tool.uv.sources]
agrimind-kernel = { workspace = true }
agents = { workspace = true }
memory = { workspace = true }
